name: Apply OpenRouter interface labels

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-openrouter-labels.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace old Gemini labels
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              "app/keyboards.py": {
                  "📷 قراءة صورة بجيمناي": "📷 قراءة صورة بـ GPT-5.4 Mini",
                  "📷 قراءة صورة بواسطة Gemini": "📷 قراءة صورة بواسطة GPT-5.4 Mini",
              },
              "app/handlers/imports.py": {
                  "قراءة صورة بواسطة Gemini": "قراءة صورة بواسطة GPT-5.4 Mini",
                  "سيستخرج Gemini": "سيستخرج GPT-5.4 Mini",
                  "جاري تنزيل الصورة وتحليلها بواسطة Gemini…": "جاري تنزيل الصورة وتحليلها بواسطة GPT-5.4 Mini…",
                  "⚠️ تحذيرات Gemini:": "⚠️ تحذيرات GPT:",
              },
              "app/handlers/admin.py": {
                  "Gemini مناسب": "GPT-5.4 Mini مناسب",
                  "📷 Gemini:": "📷 GPT-5.4 Mini:",
              },
              "app/texts.py": {
                  'source = "Gemini" if batch.source_type == "gemini" else': 'source = "GPT-5.4 Mini عبر OpenRouter" if batch.source_type == "gemini" else',
              },
          }

          for filename, mapping in replacements.items():
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              for old, new in mapping.items():
                  count = text.count(old)
                  if count < 1:
                      raise SystemExit(f"Expected label not found in {filename}: {old}")
                  text = text.replace(old, new)
              path.write_text(text, encoding="utf-8")
          PY

      - name: Verify source compiles
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m compileall -q app main.py tests

      - name: Commit labels
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/keyboards.py app/handlers/imports.py app/handlers/admin.py app/texts.py
          git commit -m "Update image import labels for OpenRouter GPT"
          git push origin main
