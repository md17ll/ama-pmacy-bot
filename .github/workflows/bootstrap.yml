name: Bootstrap complete project

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bootstrap:
    if: contains(github.event.head_commit.message, '[bootstrap]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract complete project
        run: |
          unzip -o .bootstrap/project.zip -d .
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap.yml

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: |
          pytest -q
          python -m compileall -q app main.py

      - name: Commit complete project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete Amuda pharmacy bot project"
          git push
