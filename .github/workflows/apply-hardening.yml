name: Apply async repository fix

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-hardening.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix async alias loading before audit serialization
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("app/repositories.py")
          text = path.read_text(encoding="utf-8")
          old = "    session.add(\n        AuditLog(\n            admin_id=admin_id,\n            action=\"pharmacy_create\","
          new = "    await session.refresh(pharmacy, attribute_names=[\"aliases\"])\n    session.add(\n        AuditLog(\n            admin_id=admin_id,\n            action=\"pharmacy_create\","
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"Expected one create_pharmacy audit block, found {count}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Verify source compiles
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m compileall -q app main.py tests

      - name: Commit repository fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/repositories.py
          git commit -m "Fix async pharmacy audit serialization"
          git push origin main
